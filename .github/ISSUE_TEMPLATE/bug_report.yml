name: "🐛 Bug Report"
description: Report a reproducible problem or unexpected behavior
title: "[Bug]: "
labels: ["fix"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug.
        Please do not include API keys, tokens, personal data, or other sensitive information.

  - type: textarea
    id: description
    attributes:
      label: "🐛 Bug Description"
      description: Describe what happened and how it affected you.
      placeholder: A clear and concise description of the problem.
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: "📍 Location"
      description: Where did the problem occur?
      placeholder: For example, the Radar page, an API endpoint, or a local development environment
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "🔄 Steps to Reproduce"
      description: List the steps needed to reproduce the problem.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "✅ Expected Behavior"
      description: Describe what you expected to happen.
      placeholder: A clear and concise description of the expected behavior.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: "📸 Supporting Material"
      description: Add screenshots, recordings, logs, or other relevant material.
      placeholder: Drag and drop files here or paste relevant logs and links.
